{% extends 'library/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<h2>Register</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>

{% load socialaccount %}
<a href="{% provider_login_url 'google' %}">
  Sign up with Google
</a>
{% endblock %}
