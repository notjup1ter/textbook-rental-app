{% extends 'library/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>

{% load socialaccount %}
<a href="{% provider_login_url 'google' %}">
  Log in with Google
</a>
{% endblock %}
